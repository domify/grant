name: port

# Runs every ported test under SQLite and PostgreSQL with `bin/port-check --integrate`.
# Integrate mode fails on a broken or missing test, not on specs still to port; only a
# local full `bin/port-check` establishes completion.

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The iyi commit the tests are built with. Bump it when grant needs a newer compiler.
  IYI_REF: c8978396c41d88a2ef6f38fbd6af389069897374

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: crystallang/crystal:1.21.0-build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grant
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_SERVER_URL: postgres://grant:password@postgres:5432
      # Upstream specs hold UTF-8; the container defaults Ruby to US-ASCII.
      LC_ALL: C.UTF-8
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    steps:
      - uses: actions/checkout@v5
        with:
          # bin/port-check diffs crystal-upstream/ against port/START_COMMIT.
          fetch-depth: 0
          persist-credentials: false

      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ruby postgresql-client \
            libsqlite3-dev libreadline-dev libssl-dev libncurses-dev

      - name: Restore iyi
        id: iyi-cache
        uses: actions/cache@v5
        with:
          path: iyi
          key: iyi-${{ env.IYI_REF }}

      - name: Build iyi
        if: steps.iyi-cache.outputs.cache-hit != 'true'
        run: |
          git init -q iyi
          git -C iyi fetch -q --depth 1 https://github.com/iyilang/iyi.git "$IYI_REF"
          git -C iyi checkout -q FETCH_HEAD
          make -C iyi iyi

      - name: Ported tests under SQLite and PostgreSQL
        shell: bash
        run: |
          mkdir -p build/tmp
          # The iyi pg driver cannot resolve service hostnames; hand it the address.
          export PG_SERVER_URL="postgres://grant:password@$(getent hosts postgres | cut -d' ' -f1):5432"
          IYI=$PWD/iyi/bin/iyi TMPDIR=$PWD/build/tmp bin/port-check --integrate
